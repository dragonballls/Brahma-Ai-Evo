name: Brahma Evo full test verification

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest
      - name: Compile all Python sources
        shell: pwsh
        run: |
          python -m compileall -q actions agent brahma_connect core features memory plugins smart_home scripts main.py ui.py or_client.py llm_client.py workspace_store.py
      - name: Run all tests under tests/
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run bounded repository-root test modules
        shell: pwsh
        run: |
          $tests = @("test_local_brain.py", "test_self_heal.py")
          foreach ($name in $tests) {
            Write-Host "=== RUNNING $name ==="
            python $name
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run bounded Sensorium lifecycle smoke test
        shell: pwsh
        run: |
          python -c "import time; from core.sensorium import sensorium; sensorium.start(); time.sleep(1); sensorium.stop(); print('Sensorium start/stop smoke test passed')"
      - name: Compile interactive live harness
        shell: pwsh
        run: python -m py_compile test_sensorium_live.py
