name: Brahma Evo full test verification

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest
      - name: Compile all Python sources
        shell: pwsh
        run: |
          python -m compileall -q actions agent brahma_connect core features memory plugins smart_home scripts main.py ui.py or_client.py llm_client.py workspace_store.py
      - name: Run all tests under tests/
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run repository-root test modules
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path . -File -Filter "test*.py" | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "=== RUNNING $($test.Name) ==="
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
