name: Brahma Evo lightweight quality gate

concurrency:
  group: brahma-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "optimize/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-resource-guards:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependency
        run: python -m pip install requests psutil pywin32 bleak
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run low-power guards
        run: python -m unittest tests.test_low_power_guards -v
      - name: Run runtime consistency regressions
        run: python -m unittest tests.test_runtime_consistency -v
      - name: Run voice safety regressions
        run: python -m unittest tests.test_voice_guards -v
      - name: Run OmniRoute and self-coding regressions
        run: python -m unittest tests.test_omniroute_self_coding -v
      - name: Run universal capability regressions
        run: python -m unittest tests.test_universal_agent -v
      - name: Run God’s Eye globe regressions
        run: python -m unittest tests.test_gods_eye_globe -v
      - name: Run multi-model intelligence regressions
        run: python -m unittest tests.test_intelligence_orchestrator -v
      - name: Run selected advanced capability regressions
        run: python -m unittest tests.test_selected_advanced_capabilities -v
      - name: Run functional self-awareness regressions
        run: python -m unittest tests.test_self_awareness -v
      - name: Run Live duplex voice regressions
        run: python -m unittest tests.test_live_voice_contract -v
      - name: Run emotional delivery regressions
        run: python -m unittest tests.test_emotional_controller -v
      - name: Run emotional feature regressions
        run: python -m unittest tests.test_emotional_feature -v
      - name: Run speech prosody regressions
        run: python -m unittest tests.test_prosody -v
      - name: Run language lock regressions
        run: python -m unittest tests.test_language_policy -v
      - name: Run PC health and autonomous mission regressions
        run: python -m unittest tests.test_pc_health_and_missions -v
      - name: Run Brahma desktop environment regressions
        run: python -m unittest tests.test_desktop_environment -v
      - name: Run embedded web workspace regressions
        run: python -m unittest tests.test_desktop_web_host -v
      - name: Run adaptive performance brain regressions
        run: python -m unittest tests.test_performance_brain -v
      - name: Run external desktop integration regressions
        run: python -m unittest tests.test_desktop_integrations -v
      - name: Run unified device manager regressions
        run: python -m unittest tests.test_device_manager -v
      - name: Run media control and video understanding regressions
        run: python -m unittest tests.test_media_control -v
      - name: Run conversational settings regressions
        run: python -m unittest tests.test_settings_agent -v
      - name: Run OBS Studio control regressions
        run: python -m unittest tests.test_obs_control -v
      - name: Run AI Creator Studio regressions
        run: python -m unittest tests.test_creator_studio -v
