name: Brahma Evo lightweight quality gate

on:
  push:
    branches: ["main", "optimize/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-resource-guards:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q actions core features memory plugins smart_home main.py ui.py
      - name: Run low-power guards
        run: python tests/test_low_power_guards.py
