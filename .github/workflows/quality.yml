name: Brahma Evo lightweight quality gate

on:
  push:
    branches: ["main", "optimize/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-resource-guards:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q actions core features memory plugins smart_home scripts main.py ui.py
      - name: Run low-power guards
        run: python tests/test_low_power_guards.py
      - name: Run voice safety regressions
        run: python tests/test_voice_guards.py
      - name: Run OmniRoute and self-coding regressions
        run: python tests/test_omniroute_self_coding.py
      - name: Run universal capability regressions
        run: python tests/test_universal_agent.py
      - name: Run God’s Eye globe regressions
        run: python tests/test_gods_eye_globe.py
