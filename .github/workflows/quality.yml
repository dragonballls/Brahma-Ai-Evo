name: Brahma Evo lightweight quality gate

concurrency:
  group: brahma-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "optimize/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  static-and-resource-guards:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install lightweight test dependency
        run: python -m pip install --prefer-binary requests psutil pywin32 bleak pytest
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run whole-repository integrity scanner
        run: python -m unittest tests.test_repository_integrity -v
      - name: Run low-power guards
        run: python -m unittest tests.test_low_power_guards -v
      - name: Run runtime consistency regressions
        run: python -m unittest tests.test_runtime_consistency -v
      - name: Run Bluetooth media-quality audio regressions
        run: python -m unittest tests.test_audio_quality_guard -v
      - name: Run UI performance regressions
        run: python -m pytest -q tests/test_ui_performance.py
      - name: Run capability usability regressions
        run: python -m unittest tests.test_capability_usability -v

  parallel-regressions:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - group: omni-intelligence
            commands: |
              python -m unittest tests.test_voice_guards -v
              python -m unittest tests.test_omniroute_self_coding -v
              python -m unittest tests.test_universal_agent -v
              python -m pytest -q tests/test_skill_forge.py
              python -m unittest tests.test_gods_eye_globe -v
              python -m unittest tests.test_intelligence_orchestrator -v
              python -m pytest -q tests/test_intellect_meter.py tests/test_cognitive_challenger.py
              python -m pytest -q tests/test_model_performance.py tests/test_adaptive_routing.py

          - group: conversation-voice
            commands: |
              python -m unittest tests.test_conversation_delivery -v
              python -m unittest tests.test_jev_integration -v
              python -m unittest tests.test_selected_advanced_capabilities -v
              python -m unittest tests.test_self_awareness -v
              python -m unittest tests.test_live_voice_contract -v
              python -m unittest tests.test_emotional_controller -v
              python -m unittest tests.test_emotional_feature -v
              python -m unittest tests.test_prosody -v
              python -m unittest tests.test_language_policy -v

          - group: desktop-system
            commands: |
              python -m unittest tests.test_pc_health_and_missions -v
              python -m unittest tests.test_desktop_environment -v
              python -m unittest tests.test_desktop_web_host -v
              python -m unittest tests.test_performance_brain -v
              python -m unittest tests.test_desktop_integrations -v
              python -m unittest tests.test_device_manager -v

          - group: media-settings
            commands: |
              python -m unittest tests.test_media_control -v
              python -m unittest tests.test_settings_agent -v
              python -m unittest tests.test_obs_control -v
              python -m unittest tests.test_creator_studio -v

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install lightweight test dependency
        run: python -m pip install requests psutil pywin32 bleak pytest
      - name: Run ${{ matrix.group }} regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $commands = @'
          ${{ matrix.commands }}
          '@
          & ([scriptblock]::Create($commands))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
