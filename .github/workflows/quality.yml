name: Brahma Evo lightweight quality gate

concurrency:
  group: brahma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "optimize/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  filter-duplicate-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_push: ${{ steps.detect.outputs.skip_push }}
    steps:
      - name: Detect whether this branch already has an open PR
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          skip_push=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "main" ]]; then
            count="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref == env.GITHUB_REF_NAME and .head.repo.full_name == env.GITHUB_REPOSITORY)] | length")"
            echo "Open same-repository PR count for this branch: $count"
            if [[ "$count" -gt 0 ]]; then skip_push=true; fi
          fi
          echo "skip_push=$skip_push" >> "$GITHUB_OUTPUT"

  static-and-resource-guards:
    needs: filter-duplicate-push
    if: needs.filter-duplicate-push.outputs.skip_push != 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install lightweight test dependency
        run: python -m pip install --prefer-binary requests psutil pywin32 bleak pytest fastapi uvicorn cryptography numpy pillow==12.3.0 matplotlib==3.11.2 PyQt6==6.11.0 playwright==1.63.0 pyautogui
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run whole-repository integrity scanner
        run: python -m unittest tests.test_repository_integrity -v
      - name: Run low-power guards
        run: python -m unittest tests.test_low_power_guards -v
      - name: Run runtime consistency regressions
        run: python -m unittest tests.test_runtime_consistency -v
      - name: Run Bluetooth media-quality audio regressions
        run: python -m unittest tests.test_audio_quality_guard -v
      - name: Run UI performance regressions
        run: python -m pytest -q tests/test_ui_performance.py
      - name: Run capability usability regressions
        run: python -m unittest tests.test_capability_usability -v
      - name: Run lifecycle and browser security regressions
        run: python -m pytest -q tests/test_task_queue_lifecycle.py tests/test_browser_control_safety.py tests/test_browser_pinned_proxy.py
          tests/test_playwright_mcp_client.py tests/test_voice_cancellation_integrity.py

      - name: Run installer, supervisor, and crash-recovery integration regressions
        run: python -m pytest -q tests/test_installer_integration.py tests/test_process_supervisor.py tests/test_crash_recovery_smoke.py

      - name: Run follow-up audit regressions
        run: python -m pytest -q tests/test_followup_audits.py

      - name: Run audit-added standalone regressions
        run: >
          python -m pytest -q
          tests/test_memory_persistence.py
          tests/test_dashboard_security.py
          tests/test_unlock_device.py
          tests/test_llm_local_network_safety.py
          tests/test_calendar_scheduler.py
          tests/test_globe_performance.py
          tests/test_dynamic_registry_security.py
          tests/test_network_safety.py
          tests/test_network_download_safety.py
          tests/test_windows_file_safety.py
          tests/test_config_secret_migration.py
          tests/test_dashboard_crypto_fallback.py

  uncovered-regression-modules:
    needs: filter-duplicate-push
    if: needs.filter-duplicate-push.outputs.skip_push != 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install repository test dependencies
        shell: pwsh
        run: |
          python -m pip install --prefer-binary -r requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { throw "Installing repository dependencies failed with exit code $LASTEXITCODE." }
      - name: Run previously unreferenced test modules
        shell: pwsh
        run: |
          $testFiles = @(
            "tests/test_autonomous_evolution.py"
            "tests/test_background_orb_startup.py"
            "tests/test_brahma_connect_actions.py"
            "tests/test_computer_control_command_safety.py"
            "tests/test_computer_settings_safety.py"
            "tests/test_crash_resilience.py"
            "tests/test_daily_briefing.py"
            "tests/test_desktop_organizer_persistence.py"
            "tests/test_desktop_safety.py"
            "tests/test_dev_agent_safety.py"
            "tests/test_device_auth_security.py"
            "tests/test_device_manager_resolution.py"
            "tests/test_duplex_voice.py"
            "tests/test_evo_integrations.py"
            "tests/test_executor_recovery_contract.py"
            "tests/test_feature_creation_routing.py"
            "tests/test_gateway_device_manager_integrity.py"
            "tests/test_gesture_utils.py"
            "tests/test_google_workspace_security.py"
            "tests/test_identity_persistence.py"
            "tests/test_instagram_worker_lifecycle.py"
            "tests/test_learned_rules_security.py"
            "tests/test_live_cricket_scores_safety.py"
            "tests/test_local_endpoint_security.py"
            "tests/test_office_builder_output_safety.py"
            "tests/test_omniroute_runtime_download_safety.py"
            "tests/test_reminder.py"
            "tests/test_screen_processor.py"
            "tests/test_secret_redaction.py"
            "tests/test_self_model_persistence.py"
            "tests/test_send_message.py"
            "tests/test_settings_dispatch_boundaries.py"
            "tests/test_smart_home_completion_semantics.py"
            "tests/test_spotify_settings_card.py"
            "tests/test_stock_prices_safety.py"
            "tests/test_system_diagnostics.py"
            "tests/test_updater_ota_security.py"
            "tests/test_weather_report_safety.py"
          )
          python -m pytest -q $testFiles
          if ($LASTEXITCODE -ne 0) { throw "Previously unreferenced repository tests failed with exit code $LASTEXITCODE." }

  parallel-regressions:
    needs: filter-duplicate-push
    if: needs.filter-duplicate-push.outputs.skip_push != 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - group: omni-intelligence
            commands: |
              python -m unittest tests.test_voice_guards -v
              python -m unittest tests.test_omniroute_self_coding -v
              python -m unittest tests.test_universal_agent -v
              python -m pytest -q tests/test_skill_forge.py tests/test_provider_routing_integrity.py tests/test_self_coding_recovery_behavior.py tests/test_dev_agent_integrity.py
              python -m unittest tests.test_gods_eye_globe -v
              python -m unittest tests.test_intelligence_orchestrator -v
              python -m pytest -q tests/test_intellect_meter.py tests/test_cognitive_challenger.py
              python -m pytest -q tests/test_model_performance.py tests/test_adaptive_routing.py

          - group: conversation-voice
            commands: |
              python -m unittest tests.test_conversation_delivery -v
              python -m unittest tests.test_jev_integration -v
              python -m unittest tests.test_selected_advanced_capabilities -v
              python -m unittest tests.test_self_awareness -v
              python -m unittest tests.test_live_voice_contract -v
              python -m unittest tests.test_emotional_controller -v
              python -m unittest tests.test_emotional_feature -v
              python -m unittest tests.test_prosody -v
              python -m unittest tests.test_language_policy -v

          - group: desktop-system
            commands: |
              python -m unittest tests.test_pc_health_and_missions -v
              python -m unittest tests.test_desktop_environment -v
              python -m unittest tests.test_desktop_web_host -v
              python -m unittest tests.test_performance_brain -v
              python -m unittest tests.test_desktop_integrations -v
              python -m unittest tests.test_device_manager -v
              python -m pytest -q tests/test_tool_completion_semantics.py

          - group: media-settings
            commands: |
              python -m unittest tests.test_media_control -v
              python -m unittest tests.test_settings_agent -v
              python -m unittest tests.test_obs_control -v
              python -m unittest tests.test_creator_studio -v

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install lightweight test dependency
        run: python -m pip install requests psutil pywin32 bleak pytest numpy playwright==1.63.0
      - name: Run ${{ matrix.group }} regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $commands = @'
          ${{ matrix.commands }}
          '@
          foreach ($command in ($commands -split "\r?\n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
            & ([scriptblock]::Create($command))
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              throw "Regression command failed (exit $exitCode): $command"
            }
          }
