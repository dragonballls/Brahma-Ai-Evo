name: Brahma Evo Targeted Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check requests fastapi uvicorn

      - name: Compile touched Python modules
        run: >
          python -m compileall -q
          main.py
          or_client.py
          core/intelligence_orchestrator.py
          tests/test_omniroute_self_coding.py

      - name: Run targeted regression tests
        run: >
          python -m unittest -v
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_release_contract
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_is_local_and_lazy
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_lifecycle_lock_keeps_slow_startup_off_state_lock
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_provider_operations_are_lifecycle_safe
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_ensemble_concurrency_honors_parallel_worker_setting
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_openrouter_failed_model_backoff_contract
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_openrouter_forbidden_model_skips_instead_of_aborting
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_structured_ensemble_has_no_stale_global_executor
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_device_and_smart_home_routing_is_off_ui_thread
          tests.test_repository_integrity.RepositoryIntegrityTests.test_first_party_import_targets_exist
          tests.test_repository_integrity.RepositoryIntegrityTests.test_android_compose_icon_dependency_matches_usage
          tests.test_repository_integrity.RepositoryIntegrityTests.test_bootstrap_validates_existing_venv_python_version
          tests.test_repository_integrity.RepositoryIntegrityTests.test_bootstrap_caches_and_validates_runtime_installers
          tests.test_capability_usability
          tests.test_followup_audits