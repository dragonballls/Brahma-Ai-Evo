name: Brahma Evo Targeted Regression

concurrency:
  group: brahma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check requests fastapi uvicorn pytest cryptography pillow matplotlib speedtest-cli psutil playwright==1.63.0 pyautogui PyQt6==6.11.0 reportlab==5.0.1 python-docx==1.2.0 sounddevice==0.5.6 mss==10.2.0

      - name: Compile touched Python modules
        run: >
          python -m compileall -q
          main.py
          or_client.py
          core/intelligence_orchestrator.py
          tests/test_omniroute_self_coding.py

      - name: Configure headless GUI runtime
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb xauth libegl1 libgl1
          XAUTHORITY="$RUNNER_TEMP/brahma-xauthority"
          touch "$XAUTHORITY"
          COOKIE="$(mcookie)"
          xauth -f "$XAUTHORITY" add :99 . "$COOKIE"
          Xvfb :99 -screen 0 1280x1024x24 -auth "$XAUTHORITY" -nolisten tcp >"$RUNNER_TEMP/brahma-xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/brahma-xvfb.pid"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "XAUTHORITY=$XAUTHORITY" >> "$GITHUB_ENV"

      - name: Run standalone regression contracts
        run: python -m pytest -q tests/test_process_supervisor.py tests/test_crash_recovery_smoke.py

      - name: Run selected unittest regression checks
        run: >
          python -m unittest -v
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_release_contract
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_is_local_and_lazy
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_lifecycle_lock_keeps_slow_startup_off_state_lock
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_provider_operations_are_lifecycle_safe
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_ensemble_concurrency_honors_parallel_worker_setting
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_openrouter_failed_model_backoff_contract
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_openrouter_forbidden_model_skips_instead_of_aborting
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_structured_ensemble_has_no_stale_global_executor
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_device_and_smart_home_routing_is_off_ui_thread
          tests.test_repository_integrity.RepositoryIntegrityTests.test_first_party_import_targets_exist
          tests.test_repository_integrity.RepositoryIntegrityTests.test_android_compose_icon_dependency_matches_usage
          tests.test_repository_integrity.RepositoryIntegrityTests.test_bootstrap_validates_existing_venv_python_version
          tests.test_repository_integrity.RepositoryIntegrityTests.test_bootstrap_caches_and_validates_runtime_installers

  targeted-suites:
    name: Targeted suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: core-omniroute-and-dev
            tests: >-
              tests/test_capability_usability.py
              tests/test_crucible_security.py
              tests/test_android_capability_contract.py
              tests/test_background_monitor_guards.py
              tests/test_dynamic_registry_matching.py
              tests/test_omniroute_lifecycle.py
              tests/test_command_router_contract.py
              tests/test_gateway_protocol_limits.py
              tests/test_gateway_connection_limits.py
              tests/test_mobile_autopilot_safety.py
              tests/test_self_coding_integrity.py
              tests/test_self_coding_recovery_behavior.py
              tests/test_provider_routing_integrity.py
              tests/test_dev_agent_integrity.py
              tests/test_repository_sync.py
          - name: desktop-system-and-persistence
            tests: >-
              tests/test_desktop_organizer_safety.py
              tests/test_brahma_connect.py
              tests/test_desktop_workspace_persistence.py
              tests/test_workspace_store_security.py
              tests/test_plugin_manager_safety.py
              tests/test_selected_advanced_capabilities.py
              tests/test_system_manager_safety.py
              tests/test_crash_recovery_security.py
              tests/test_auto_heal_history_atomicity.py
              tests/test_auto_heal_security.py
              tests/test_continuous_evolution.py
              tests/test_self_awareness.py
          - name: browser-files-and-app-control
            tests: >-
              tests/test_browser_control_safety.py
              tests/test_file_controller_security.py
              tests/test_file_processor_security.py
              tests/test_omniroute_endpoint_safety.py
              tests/test_updater_safety.py
              tests/test_dev_agent_command_safety.py
              tests/test_brahma_dev_agent_shell_safety.py
              tests/test_pdf_output_safety.py
              tests/test_docx_output_safety.py
              tests/test_open_app_safety.py
              tests/test_cmd_control_safety.py
              tests/test_computer_control_safety.py
              tests/test_ppt_template_network_safety.py
              tests/test_app_host_safety.py
              tests/test_meeting_assistant_contract.py
          - name: network-integrations
            tests: >-
              tests/test_android_connection_safety.py
              tests/test_device_location_network_safety.py
              tests/test_github_research_safety.py
              tests/test_life360_network_safety.py
              tests/test_geospatial_network_safety.py
              tests/test_command_safety.py
              tests/test_youtube_video_safety.py
              tests/test_spotify_controller_safety.py
              tests/test_google_workspace_network_safety.py
              tests/test_flights_specific_area_network_safety.py
              tests/test_speed_test_safety.py
              tests/test_or_client_network_safety.py
              tests/test_send_message_safety.py
          - name: false-success-actions
            tests: >-
              tests/test_false_success_actions.py
          - name: persistence-fail-closed
            tests: >-
              tests/test_persistence_fail_closed.py
          - name: model-performance
            tests: >-
              tests/test_model_performance.py
          - name: lifecycle-and-browser
            tests: >-
              tests/test_task_queue_lifecycle.py
              tests/test_browser_pinned_proxy.py
              tests/test_playwright_mcp_client.py
              tests/test_voice_cancellation_integrity.py
          - name: followup-and-standalone
            tests: >-
              tests/test_followup_audits.py
              tests/test_memory_persistence.py
              tests/test_dashboard_security.py
              tests/test_unlock_device.py
              tests/test_llm_local_network_safety.py
              tests/test_calendar_scheduler.py
              tests/test_globe_performance.py
              tests/test_dynamic_registry_security.py
              tests/test_network_safety.py
              tests/test_network_download_safety.py
              tests/test_windows_file_safety.py

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check requests fastapi uvicorn pytest cryptography pillow matplotlib speedtest-cli psutil playwright==1.63.0 pyautogui PyQt6==6.11.0 reportlab==5.0.1 python-docx==1.2.0 sounddevice==0.5.6 mss==10.2.0

      - name: Configure headless GUI runtime
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb xauth libegl1 libgl1
          XAUTHORITY="$RUNNER_TEMP/brahma-xauthority"
          touch "$XAUTHORITY"
          COOKIE="$(mcookie)"
          xauth -f "$XAUTHORITY" add :99 . "$COOKIE"
          Xvfb :99 -screen 0 1280x1024x24 -auth "$XAUTHORITY" -nolisten tcp >"$RUNNER_TEMP/brahma-xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/brahma-xvfb.pid"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "XAUTHORITY=$XAUTHORITY" >> "$GITHUB_ENV"

      - name: Run targeted suite
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.name }}" == "persistence-fail-closed" ]]; then
            python -m pip install --disable-pip-version-check pytest-timeout
            python -m pytest --collect-only -vv -s tests/test_persistence_fail_closed.py
            python -m pytest -vv -s --timeout=120 --timeout-method=signal tests/test_persistence_fail_closed.py
          else
            python -m pytest -q ${{ matrix.tests }}
          fi

