name: Brahma Evo Targeted Regression

concurrency:
  group: brahma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check requests fastapi uvicorn pytest cryptography

      - name: Compile touched Python modules
        run: >
          python -m compileall -q
          main.py
          or_client.py
          core/intelligence_orchestrator.py
          tests/test_omniroute_self_coding.py

      - name: Run targeted regression tests
        run: >
          python -m unittest -v
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_release_contract
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_is_local_and_lazy
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_lifecycle_lock_keeps_slow_startup_off_state_lock
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_omniroute_provider_operations_are_lifecycle_safe
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_ensemble_concurrency_honors_parallel_worker_setting
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_openrouter_failed_model_backoff_contract
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_openrouter_forbidden_model_skips_instead_of_aborting
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_structured_ensemble_has_no_stale_global_executor
          tests.test_omniroute_self_coding.OmniRouteSelfCodingTests.test_device_and_smart_home_routing_is_off_ui_thread
          tests.test_repository_integrity.RepositoryIntegrityTests.test_first_party_import_targets_exist
          tests.test_repository_integrity.RepositoryIntegrityTests.test_android_compose_icon_dependency_matches_usage
          tests.test_repository_integrity.RepositoryIntegrityTests.test_bootstrap_validates_existing_venv_python_version
          tests.test_repository_integrity.RepositoryIntegrityTests.test_bootstrap_caches_and_validates_runtime_installers
          tests.test_capability_usability
          tests.test_crucible_security
          tests.test_android_capability_contract
          tests.test_background_monitor_guards
          tests.test_dynamic_registry_matching
          tests.test_omniroute_lifecycle
          tests.test_command_router_contract
          tests.test_gateway_protocol_limits
          tests.test_gateway_connection_limits
          tests.test_android_connection_safety
          tests.test_open_app_safety
          tests.test_youtube_video_safety
          tests.test_send_message_safety
          tests.test_crash_recovery_security
          tests.test_self_awareness
          tests.test_auto_heal_history_atomicity
          tests.test_dynamic_registry_security
          tests.test_local_endpoint_security
          tests.test_device_manager_resolution
          tests.test_local_endpoint_security
          tests.test_secret_redaction
          tests.test_tool_completion_semantics
          tests.test_auto_heal_security
          tests.test_learned_rules_security
          tests.test_android_capability_contract

      - name: Run lifecycle and browser security regressions
        run: python -m pytest -q tests/test_task_queue_lifecycle.py tests/test_browser_control_safety.py

      - name: Run false-success action regressions
        run: python -m pytest -q tests/test_false_success_actions.py

      - name: Run persistence fail-closed regressions
        run: python -m pytest -q tests/test_persistence_fail_closed.py

      - name: Run module-level follow-up regression suite
        run: python -m pytest -q tests/test_followup_audits.py
