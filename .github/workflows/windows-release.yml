name: Brahma Evo Windows launch build

concurrency:
  group: brahma-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read canonical runtime contract
        id: runtime
        shell: pwsh
        run: |
          $node = python -c "from core.runtime_contract import NODE_VERSION; print(NODE_VERSION)"
          $omni = python -c "from core.runtime_contract import OMNIROUTE_VERSION; print(OMNIROUTE_VERSION)"
          "NODE_VERSION=$node" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "OMNIROUTE_VERSION=$omni" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          python -m pip install pyinstaller==6.22.3
          python -m pip check

      - name: Run fast repository regression gate
        shell: pwsh
        run: |
          python -m compileall -q actions agent core features memory plugins smart_home main.py llm_client.py or_client.py ui.py
          python -m unittest -q tests.test_repository_integrity tests.test_runtime_consistency tests.test_conversation_delivery

      - name: Restore cached OmniRoute runtime
        id: omni-cache
        uses: actions/cache/restore@v4
        with:
          path: build_vendor/omniroute_runtime
          key: windows-omniroute-${{ hashFiles('core/runtime_contract.py', 'scripts/prepare_omniroute_runtime.py') }}

      - name: Prepare pinned OmniRoute runtime
        if: ${{ steps.omni-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          python scripts/prepare_omniroute_runtime.py build_vendor/omniroute_runtime

      - name: Verify cached or prepared OmniRoute runtime
        shell: pwsh
        run: |
          $manifest = Get-Content build_vendor/omniroute_runtime/runtime-manifest.txt -Raw
          $nodeVersion = "${{ steps.runtime.outputs.NODE_VERSION }}"
          $omniVersion = "${{ steps.runtime.outputs.OMNIROUTE_VERSION }}"
          if ($manifest -notmatch "node=$nodeVersion") { throw "Unexpected Node runtime manifest." }
          if ($manifest -notmatch "omniroute=$omniVersion") { throw "Unexpected OmniRoute version." }
          if (-not (Test-Path "build_vendor/omniroute_runtime/node.exe")) { throw "Bundled Node runtime missing." }
          if (-not (Test-Path "build_vendor/omniroute_runtime/node_modules/omniroute/bin/omniroute.mjs")) { throw "Bundled OmniRoute entrypoint missing." }
          python -c "from pathlib import Path; import sys; root=Path('build_vendor/omniroute_runtime'); sys.path.insert(0, str(Path('.').resolve())); from scripts.prepare_omniroute_runtime import _healthy; raise SystemExit(0 if _healthy(root) else 1)"

      - name: Cache verified OmniRoute runtime
        if: ${{ success() && steps.omni-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build_vendor/omniroute_runtime
          key: windows-omniroute-${{ hashFiles('core/runtime_contract.py', 'scripts/prepare_omniroute_runtime.py') }}

      - name: Build Brahma Evo
        shell: pwsh
        run: |
          python -m PyInstaller installer/BrahmaEvo.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/BrahmaEvo/BrahmaEvo.exe")) { throw "BrahmaEvo.exe was not produced." }

      - name: Build crash supervisor
        shell: pwsh
        run: |
          python -m PyInstaller installer/BrahmaEvo_Supervisor.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/BrahmaEvoSupervisor.exe")) { throw "BrahmaEvoSupervisor.exe was not produced." }
          Copy-Item "dist/BrahmaEvoSupervisor.exe" "dist/BrahmaEvo/BrahmaEvoSupervisor.exe" -Force

      - name: Verify complete runnable Brahma Evo tree
        shell: pwsh
        run: |
          $required = @(
            "dist/BrahmaEvo/BrahmaEvo.exe",
            "dist/BrahmaEvo/BrahmaEvoSupervisor.exe",
            "dist/BrahmaEvo/_internal/python312.dll",
            "dist/BrahmaEvo/_internal/python3.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Runnable package file missing: $path" }
          }
          Write-Host "Complete runnable Brahma Evo tree verified, including bundled Python runtime."

      - name: Restore cached Brahma Evo payload
        id: payload-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/BrahmaEvoPayload.zip
          key: windows-payload-${{ hashFiles('dist/BrahmaEvo/**') }}

      - name: Pack verified Brahma Evo payload
        if: ${{ steps.payload-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          python scripts/pack_windows_payload.py dist/BrahmaEvo dist/BrahmaEvoPayload.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/BrahmaEvoPayload.zip")) { throw "BrahmaEvoPayload.zip was not produced." }

      - name: Verify packed Brahma Evo payload
        shell: pwsh
        run: |
          python scripts/pack_windows_payload.py dist/BrahmaEvo dist/BrahmaEvoPayload.zip --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache verified Brahma Evo payload
        if: ${{ success() && steps.payload-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: dist/BrahmaEvoPayload.zip
          key: windows-payload-${{ hashFiles('dist/BrahmaEvo/**') }}

      - name: Build setup wizard
        shell: pwsh
        run: |
          python -m PyInstaller installer/BrahmaEvo_Setup.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/BrahmaEvo_Setup.exe")) { throw "BrahmaEvo_Setup.exe was not produced." }

      - name: Smoke-test packaged Brahma Evo through supervisor
        shell: pwsh
        env:
          BRAHMA_EVO_TEST_MODE: "1"
          BRAHMA_EVO_TEST_AUTO_EXIT_SECONDS: "5"
          BRAHMA_SKIP_STARTUP_UPDATE: "1"
          BRAHMA_EVOLUTION_ENABLED: "0"
          BRAHMA_EVO_TEST_SUPERVISOR_TIMEOUT: "90"
        run: |
          $supervisor = (Resolve-Path "dist/BrahmaEvo/BrahmaEvoSupervisor.exe").Path
          $proc = Start-Process -FilePath $supervisor -WorkingDirectory (Split-Path $supervisor) -PassThru
          if (-not $proc.WaitForExit(120000)) {
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw "BrahmaEvoSupervisor.exe did not exit during the packaged smoke test."
          }
          if ($proc.ExitCode -ne 0) {
            throw "BrahmaEvoSupervisor.exe exited with code $($proc.ExitCode)."
          }
          Write-Host "Packaged Brahma Evo supervisor + child smoke test passed with exit code 0."

      - name: Collect packaged startup diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Write-Host "=== Packaged child log ==="
          if (Test-Path "dist/BrahmaEvo/.brahma-ci-child.log") {
            Get-Content "dist/BrahmaEvo/.brahma-ci-child.log" -Tail 250
          } else {
            Write-Host "No packaged child log found."
          }

          $localAppData = [Environment]::GetFolderPath("LocalApplicationData")
          $logDir = Join-Path $localAppData "BrahmaAI\logs"
          Write-Host "=== Brahma startup log ==="
          $startup = Join-Path $logDir "startup.log"
          if (Test-Path $startup) {
            Get-Content $startup -Tail 300
          } else {
            Write-Host "No startup.log found at $startup"
          }

          Write-Host "=== Supervisor log ==="
          $supervisorLog = Join-Path $logDir "supervisor.log"
          if (Test-Path $supervisorLog) {
            Get-Content $supervisorLog -Tail 300
          } else {
            Write-Host "No supervisor.log found at $supervisorLog"
          }

          Write-Host "=== Fatal crash log ==="
          $fatal = Join-Path $logDir "FATAL_CRASH.log"
          if (Test-Path $fatal) {
            Get-Content $fatal -Tail 200
          } else {
            Write-Host "No FATAL_CRASH.log found."
          }

      - name: Smoke-test packaged crash recovery mode
        shell: pwsh
        run: |
          # Keep the recovery-mode contract hermetic. The normal GUI smoke test
          # writes user-scoped state, so never let that state determine this check.
          $recoveryRoot = Join-Path $env:RUNNER_TEMP "BrahmaRecoverySmoke"
          Remove-Item -Recurse -Force $recoveryRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $recoveryRoot | Out-Null
          $env:LOCALAPPDATA = $recoveryRoot

          $supervisor = (Resolve-Path "dist/BrahmaEvo/BrahmaEvoSupervisor.exe").Path
          $stdout = Join-Path $recoveryRoot "stdout.log"
          $stderr = Join-Path $recoveryRoot "stderr.log"
          $proc = Start-Process -FilePath $supervisor -ArgumentList "--recover-crash" -WorkingDirectory (Split-Path $supervisor) -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          Write-Host "Recovery worker stdout: $out"
          if ($err) { Write-Host "Recovery worker stderr: $err" }

          if ($proc.ExitCode -ne 0) {
            throw "BrahmaEvoSupervisor.exe crash-recovery mode exited with code $($proc.ExitCode). Result: $out"
          }
          Write-Host "Packaged crash-recovery worker mode passed."

      - name: Verify setup payload integration
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BrahmaEvo_Setup.exe")) { throw "Setup wizard missing." }
          if (-not (Test-Path "dist/BrahmaEvoPayload.zip")) { throw "Setup payload archive missing." }
          if ((Get-Item "dist/BrahmaEvoPayload.zip").Length -le 0) { throw "Setup payload archive is empty." }

      - name: Smoke-test setup wizard
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/BrahmaEvo_Setup.exe").Path
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            $exitCode = $proc.ExitCode
            throw "BrahmaEvo_Setup.exe exited during launch smoke test with code $exitCode."
          }
          Write-Host "BrahmaEvo_Setup.exe remained running for the launch smoke test."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Wait-Process -Id $proc.Id -Timeout 10 -ErrorAction SilentlyContinue

      - name: Prepare fast portable download
        shell: pwsh
        run: |
          Copy-Item "dist/BrahmaEvoPayload.zip" "dist/Brahma-Evo-Windows-Portable.zip" -Force
          if (-not (Test-Path "dist/Brahma-Evo-Windows-Portable.zip")) { throw "Portable download archive was not produced." }
      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/BrahmaEvo/BrahmaEvo.exe",
            "dist/BrahmaEvo/BrahmaEvoSupervisor.exe",
            "dist/BrahmaEvoSupervisor.exe",
            "dist/BrahmaEvo_Setup.exe",
            "dist/BrahmaEvoPayload.zip",
            "dist/Brahma-Evo-Windows-Portable.zip"
          )
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path)" } |
            Set-Content dist/SHA256SUMS.txt


      - name: Publish verified Brahma Evo application
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-Evo-Windows-App-${{ github.run_number }}
          compression-level: 0
          path: |
            dist/Brahma-Evo-Windows-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified setup wizard
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-Evo-Windows-Installer-${{ github.run_number }}
          compression-level: 0
          path: |
            dist/BrahmaEvo_Setup.exe
            dist/BrahmaEvoPayload.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
