name: Brahma Evo Windows launch build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3
          python -m pip check

      - name: Prepare pinned OmniRoute runtime
        shell: pwsh
        run: |
          python scripts/prepare_omniroute_runtime.py build_vendor/omniroute_runtime

      - name: Verify OmniRoute runtime
        shell: pwsh
        run: |
          $manifest = Get-Content build_vendor/omniroute_runtime/runtime-manifest.txt -Raw
          if ($manifest -notmatch "node=24.21.0") { throw "Unexpected Node runtime manifest." }
          if ($manifest -notmatch "omniroute=3.8.50") { throw "Unexpected OmniRoute version." }
          if (-not (Test-Path "build_vendor/omniroute_runtime/node.exe")) { throw "Bundled Node runtime missing." }
          if (-not (Test-Path "build_vendor/omniroute_runtime/node_modules/omniroute/bin/omniroute.mjs")) { throw "Bundled OmniRoute entrypoint missing." }

      - name: Build Brahma Evo
        shell: pwsh
        run: |
          python -m PyInstaller installer/BrahmaEvo.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/BrahmaEvo/BrahmaEvo.exe")) { throw "BrahmaEvo.exe was not produced." }

      - name: Build setup wizard
        shell: pwsh
        run: |
          python -m PyInstaller installer/BrahmaEvo_Setup.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/BrahmaEvo_Setup.exe")) { throw "BrahmaEvo_Setup.exe was not produced." }

      - name: Smoke-test packaged Brahma Evo
        shell: pwsh
        env:
          BRAHMA_EVO_TEST_MODE: "1"
        run: |
          $exe = (Resolve-Path "dist/BrahmaEvo/BrahmaEvo.exe").Path
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            $exitCode = $proc.ExitCode
            throw "BrahmaEvo.exe exited during launch smoke test with code $exitCode."
          }
          Write-Host "BrahmaEvo.exe remained running for the launch smoke test."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Wait-Process -Id $proc.Id -Timeout 10 -ErrorAction SilentlyContinue

      - name: Smoke-test setup wizard
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/BrahmaEvo_Setup.exe").Path
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            $exitCode = $proc.ExitCode
            throw "BrahmaEvo_Setup.exe exited during launch smoke test with code $exitCode."
          }
          Write-Host "BrahmaEvo_Setup.exe remained running for the launch smoke test."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Wait-Process -Id $proc.Id -Timeout 10 -ErrorAction SilentlyContinue

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/BrahmaEvo/BrahmaEvo.exe",
            "dist/BrahmaEvo_Setup.exe"
          )
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: Publish verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-Evo-Windows-${{ github.run_number }}
          path: |
            dist/BrahmaEvo
            dist/BrahmaEvo_Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
